name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      # 폴더 경로에 맞춰 이동 후 권한 부여 (실제 폴더 경로에 맞게 수정 필요)
      run: |
        cd green-map-z-apk-build/green-map-z
        chmod +x gradlew
      
    - name: Build with Gradle
      # APK 빌드 명령어 실행
      run: |
        cd green-map-z-apk-build/green-map-z
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        # 생성된 APK 파일의 경로
        path: green-map-z-apk-build/green-map-z/app/build/outputs/apk/debug/app-debug.apk
